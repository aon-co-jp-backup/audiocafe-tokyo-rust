[package]
name = "audiocafe-tokyo-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "audiocafe-tokyo-server"
path = "src/main.rs"

[dependencies]
open-runo-router = { path = "../RPoem/crates/open-runo-router" }
hyper = { version = "1.10", features = ["full"] }
bytes = "1.9"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tracing = "0.1"
tracing-subscriber = "0.3"
rust-json = { path = "../RS-JSON", features = ["fast"] }
# JSONを速い値の型(sonic_rs::Value)で読む(RS-JSONの方針、2026-10-16)。値のメソッド(get/as_str等)を使うために直接も依存する。
sonic-rs = "0.3"
regex = "1"
once_cell = "1"
html-escape = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
